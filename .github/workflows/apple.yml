# Builds the app (apps/apple, SPEC.md §33) for iPhone and iPad (the
# simulator) and for Mac (Mac Catalyst), with no signing: the check that the
# Swift compiles. -quiet prints the warnings and the errors only. Runs only when the app's own files change.
name: Apple app

on:
  push:
    paths:
      - "apps/apple/**"
      - ".github/workflows/apple.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Xcode version
        run: xcodebuild -version
      - name: Build for iPhone and iPad
        run: |
          xcodebuild -quiet -project apps/apple/Unitos.xcodeproj -scheme Unitos -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Build for Mac
        run: |
          xcodebuild -quiet -project apps/apple/Unitos.xcodeproj -scheme Unitos -configuration Debug \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            CODE_SIGNING_ALLOWED=NO build
