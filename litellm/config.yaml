# The AI gateway (SPEC.md §2): LiteLLM in front of every AI provider the app
# calls. The app reaches it with one key (LITELLM_API_KEY); the provider keys
# live here, in the gateway host's environment. lib/gateway.ts names the
# route each client takes.
#
# Model names are the provider's prefix and the provider's own id, so a new
# version needs no change here: the bimonthly model update probes
# moonshot/kimi-k4 the day Moonshot publishes it. Prices come from LiteLLM's
# own price list, which carries every model below; the gateway page in the
# admin console shows them.

model_list:
  # GLM 5.3 — the reader's tools, the assistant, Stitch's answer, Merge with
  # AI; GLM 5.3 Flash — every reading and the parse passes. Z.ai's API is
  # OpenAI-compatible, and the openai route with Z.ai's base URL is what
  # forwards the app's reasoning_effort as written (LiteLLM's own zai route
  # drops it). The prices are Z.ai's list, so the spend logs price them.
  - model_name: zai/glm-5.3
    litellm_params:
      model: openai/glm-5.3
      api_base: https://api.z.ai/api/paas/v4
      api_key: os.environ/ZAI_API_KEY
    model_info:
      input_cost_per_token: 0.0000014
      output_cost_per_token: 0.0000044
      cache_read_input_token_cost: 0.00000026
      max_input_tokens: 1000000
      max_output_tokens: 128000
      supports_reasoning: true
  - model_name: zai/glm-5.3-flash
    litellm_params:
      model: openai/glm-5.3-flash
      api_base: https://api.z.ai/api/paas/v4
      api_key: os.environ/ZAI_API_KEY
    model_info:
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.0000005
      cache_read_input_token_cost: 0.00000003
      max_input_tokens: 1000000
      max_output_tokens: 128000
      supports_reasoning: true
      supports_vision: true

  # Kimi — the calls that carry an image, the assistant with Web on, and the
  # bimonthly model update's probes. Chat completions, OpenAI-compatible.
  - model_name: "moonshot/*"
    litellm_params:
      model: "moonshot/*"
      api_key: os.environ/MOONSHOT_API_KEY
      # An account on the China platform: api_base: https://api.moonshot.cn/v1
      # (and the /moonshot pass-through target below to match).

  # Claude — the app's own Claude calls take the /anthropic pass-through
  # below, not this route, so every Anthropic field but one survives as
  # written (the effort; the pass-through strips `fallbacks`, a name it
  # keeps for its own router, so the app reruns a refusal itself). This
  # route is what the Kimi fallback and a /v1/messages call reach.
  - model_name: "anthropic/*"
    litellm_params:
      model: "anthropic/*"
      api_key: os.environ/ANTHROPIC_API_KEY

  # Gemini — video reads take the /gemini pass-through below (the file store
  # is on it too). This route is for a chat call that names gemini/<id>.
  - model_name: "gemini/*"
    litellm_params:
      model: "gemini/*"
      api_key: os.environ/GEMINI_API_KEY

  # Transcription: Groq Whisper first ($0.04 an hour), OpenAI Whisper next.
  # The app's own ladder (lib/video/transcribe.ts) moves from one to the
  # next and records each under its own price, so no fallback is set here.
  - model_name: groq/whisper-large-v3-turbo
    litellm_params:
      model: groq/whisper-large-v3-turbo
      api_key: os.environ/GROQ_API_KEY
  - model_name: openai/whisper-1
    litellm_params:
      model: openai/whisper-1
      api_key: os.environ/OPENAI_API_KEY

  # Voice: OpenAI reads aloud when the free Edge voice fails.
  - model_name: openai/gpt-4o-mini-tts
    litellm_params:
      model: openai/gpt-4o-mini-tts
      api_key: os.environ/OPENAI_API_KEY

router_settings:
  # A call that fails (an outage, a 5xx after the retries) runs again on the
  # next model: a GLM call on Kimi K3, which takes the same effort levels
  # and reads what GLM reads; a Kimi call on Claude Opus 5 through the
  # gateway's own translation. Each step costs more per token, so this only
  # ever runs on a failure; the gateway page's spend by model shows when it
  # did.
  fallbacks:
    - "zai/glm-5.3": ["moonshot/kimi-k3"]
    - "zai/glm-5.3-flash": ["moonshot/kimi-k3"]
    - "moonshot/kimi-k3": ["anthropic/claude-opus-5"]
  num_retries: 2
  retry_after: 2
  # A deployment that fails allowed_fails times in a minute sits out for
  # cooldown_time seconds; with one deployment per provider the fallback
  # carries the calls meanwhile.
  allowed_fails: 3
  cooldown_time: 30

litellm_settings:
  # A field one provider does not take is dropped, never a 400: the Kimi
  # fallback sends Kimi's fields to Claude.
  drop_params: true
  # A price set on a model entry above (model_info) is what the spend logs
  # use for it.
  custom_pricing: true
  # A long document at max effort runs for minutes; the app's routes allow
  # up to 300 s, and a transcription upload longer.
  request_timeout: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Spend logs, keys, and their limits live here. Without it the gateway
  # still routes, but records nothing and issues no key.
  database_url: os.environ/DATABASE_URL
  # Models come from this file, not from the database: a change is a commit.
  store_model_in_db: false
  pass_through_request_timeout: 600
  # Raw forwards for what the routes above do not carry. Each takes the app
  # key (auth: true) and adds the provider's own key on the way out.
  pass_through_endpoints:
    # Moonshot's API root: the web-search formula (lib/kimi.ts) and the
    # model list the bimonthly model update reads. The chat calls take the
    # moonshot/* route above, not this.
    - path: "/moonshot"
      target: "https://api.moonshot.ai/v1"
      headers:
        Authorization: "Bearer os.environ/MOONSHOT_API_KEY"
        content-type: application/json
      auth: true
      include_subpath: true
      methods: ["GET", "POST"]
    # Deepgram is not here: its request body is the media bytes, which a
    # pass-through re-encodes as JSON, and the gateway's own Deepgram route
    # answers without the speakers. The app calls Deepgram directly with
    # DEEPGRAM_API_KEY on its own host (lib/video/deepgram.ts).
    # DeepL. A Free API key (ends in :fx) answers on the free host: change
    # the target to https://api-free.deepl.com/v2/translate for one.
    - path: "/deepl/v2/translate"
      target: "https://api.deepl.com/v2/translate"
      headers:
        Authorization: "DeepL-Auth-Key os.environ/DEEPL_API_KEY"
        content-type: application/json
      auth: true
      methods: ["POST"]
  # The built-in pass-throughs need no entry: /anthropic/* reads
  # ANTHROPIC_API_KEY, /gemini/* reads GEMINI_API_KEY, each with the app key
  # as the caller's key.
